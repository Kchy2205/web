<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nutrition Label</title>
    <link
      href="https://fonts.googleapis.com/css?family=Open+Sans:400,700,800"
      rel="stylesheet"
    />
    <link href="./styles.css" rel="stylesheet" />
  </head>

  <body>
    <table class="nutrition-label">
      <thead>
        <tr>
          <h1 class="bold">Nutrition Facts</h1>
          <div class="divider"></div>
        </tr>
        <tr>
          <td>2 servings per container</td>
        </tr>
        <tr>
          <td>Serving Size</td>
          <td></td>
          <td>1 cup (255g)</td>
        </tr>
      </thead>
      <tr>
        <td></td>
        <td>Per Serving</td>
        <td>Per Container</td>
      </tr>
      <tr>
        <td>Calories</td>
        <td>220</td>
        <td>440</td>
      </tr>
      <tr>
        <td></td>
        <td>% DV*</td>
        <td>% DV*</td>
      </tr>
      <tr>
        <td>Total Fat</td>
        <td>5g 6%</td>
        <td>10g 13%</td>
      </tr>
    </table>
  </body>
</html>
