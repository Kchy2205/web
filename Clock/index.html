<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clock</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="clock">
      <img
        src="https://png.pngtree.com/png-vector/20240621/ourmid/pngtree-symbolic-circle-tree-of-nature-and-life-png-image_12657552.png"
        alt="Clock Icon"
        width="600px"
        height="600px"
      />
      <!-- Clock Face -->
      <div class="hour-hand"></div>
      <div class="minute-hand"></div>
      <div class="second-hand"></div>
      <div class="center-circle"></div>
      <!-- Clock Numbers -->
      <div class="_12">12</div>
      <div class="_1">1</div>
      <div class="_2">2</div>
      <div class="_3">3</div>
      <div class="_4">4</div>
      <div class="_5">5</div>
      <div class="_6">6</div>
      <div class="_7">7</div>
      <div class="_8">8</div>
      <div class="_9">9</div>
      <div class="_10">10</div>
      <div class="_11">11</div>
    </div>
  </body>
</html>
