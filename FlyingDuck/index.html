<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Flying Duck</title>
    <link
      href="https://fonts.googleapis.com/css?family=Open+Sans:400,700,800"
      rel="stylesheet"
    />
    <link href="./styles.css" rel="stylesheet" />
  </head>
  <body>
    <div class="duck">
      <div class="head">
        <!--hat-->
        <div class="hat">
          <div class="tassel"></div>
        </div>
        <!--eyes-->
        <div class="eye right">
          <div class="eyelash right"></div>
        </div>
        <div class="eye left">
          <div class="eyelash left"></div>
        </div>
        <!--nose-->
        <div class="nose"></div>
        <!--mouth-->
        <div class="mouth"></div>
      </div>
      <div class="body">
        <!--arms-->
        <div class="arm right"></div>
        <div class="arm left"></div>
        <!--feet-->
        <div class="foot right"></div>
        <div class="foot left"></div>
      </div>
    </div>
  </body>
</html>
